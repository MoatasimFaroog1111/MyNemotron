name: Staff Evaluation Live Gold Holdout

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staff-eval-live
  cancel-in-progress: false

jobs:
  live-gold-holdout:
    name: Live Gold Holdout - ${{ matrix.staff_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: staff-evaluation-live
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        staff_id:
          - staff-advanced-analytics
          - staff-ai-specialist
          - staff-bank-reconciliation
          - staff-content-manager
          - staff-customer-support
          - staff-cybersecurity
          - staff-data-analyst
          - staff-financial-accountant
          - staff-financial-reporting
          - staff-infrastructure-manager
          - staff-integration-engineer
          - staff-network-manager
          - staff-operations-monitor
          - staff-project-manager
          - staff-systems-developer
          - staff-ux-specialist
    env:
      NEMOTRON_BASE_URL: ${{ secrets.NEMOTRON_BASE_URL }}
      NEMOTRON_MODEL: ${{ secrets.NEMOTRON_MODEL }}
      NEMOTRON_API_KEY: ${{ secrets.NEMOTRON_API_KEY }}
      # Gold #8 showed provider contention/timeouts across all staff. Keep each
      # isolated evaluation lightweight while preserving the production gates.
      NEMOTRON_WORKER_TIMEOUT_SECONDS: "30"
      NEMOTRON_WORKER_MAX_TOKENS: "256"
      NEMOTRON_WORKER_MEMORY_LIMIT: "4"
      STAFF_WORKER_MAX_ATTEMPTS: "2"
      STAFF_WORKER_RETRY_INITIAL_SECONDS: "1"
      STAFF_WORKER_RETRY_MAX_SECONDS: "2"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate and prepare live evaluation environment
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in NEMOTRON_BASE_URL NEMOTRON_MODEL NEMOTRON_API_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub environment secret: ${name}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 2
          fi
          control_token="$(openssl rand -hex 24)"
          capability_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$control_token"
          echo "::add-mask::$capability_secret"
          {
            echo "STAFF_CONTROL_API_TOKEN=$control_token"
            echo "STAFF_CAPABILITY_HMAC_SECRET=$capability_secret"
          } >> "$GITHUB_ENV"

      - name: Install evaluation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r deploy/staff-requirements.txt

      - name: Run isolated live Gold Holdout
        run: |
          PYTHONPATH=src python -m nemotron.staff.evaluation.run \
            --staff "${{ matrix.staff_id }}" \
            --mode live \
            --suite gold-v1 \
            --format json \
            --run-id "live-${{ github.run_id }}-${{ matrix.staff_id }}" \
            > "staff-evaluation-live-${{ matrix.staff_id }}.json"

      - name: Upload live evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staff-evaluation-live-${{ matrix.staff_id }}
          path: |
            staff-evaluation-live-${{ matrix.staff_id }}.json
            evaluation-reports/
          if-no-files-found: ignore
          retention-days: 30
